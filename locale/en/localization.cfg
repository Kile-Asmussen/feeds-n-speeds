[mod-setting-description]
feeds-n-speeds-extras-radars-enable=A smaller radar to keep your factory under surveillance without breaking the bank
feeds-n-speeds-tweaks-electric-enable=Extend the reach of vanilla electric poles just a bit. Now you can have 100x100 city grids with ease.
feeds-n-speeds-tweaks-nuclear-enable=Nuclear reactors no longer aimlessly burn fuel, and heat exchangers and turbines have nice round numbers.
feeds-n-speeds-tweaks-inserter-enable=The yellow inserter is a little slower than the red, which causes strange throughput issues. Also enables burner inserters to leech fuel off furnaces.
feeds-n-speeds-tweaks-ores-enable=Ores will now be infinite and have a percentage richness equal to the richness in the map settings. Oil/fluids no longer depletes either.
feeds-n-speeds-extras-chests-enable=Adds a big 2x2 steel chest variant, and hoppers that can connect and extend the inventory of it, to allow warehouse-like functionality.
feeds-n-speeds-tweaks-chests-enable=Rebalance the chests to have somewhat more reasonable size and make the game just a little harder. (Also shoutout to modestly endowed women!)
feeds-n-speeds-tweaks-concrete-enable=Tweak concrete to be more important in the game than it is by default. This setting has interplay with other mod settings.
feeds-n-speeds-tweaks-sensibility-enable=General rebalancing tweaks of lots of different things, mostly to make the game more difficult.
feeds-n-speeds-tweaks-malltech-enable=[CLAUDE] Makes recipes for mall items more difficult - assembling machines, mining drills, boilers, steam engines, and nuclear equipment require more resources.
feeds-n-speeds-tweaks-earlygame-enable=[CLAUDE] Restructures early game progression, making steel processing a trigger-based technology and adjusting recipe availability.
feeds-n-speeds-extras-altrecipes-enable=[CLAUDE] Adds alternative recipes for rails using concrete and stone-brick, unlocked via crafting refined concrete.
feeds-n-speeds-extras-drills-enable=[CLAUDE] Adds burner and electric mining drill variants with fluid input for mining fluid-requiring ores. Removes fluid input from vanilla electric drill.
feeds-n-speeds-extras-ores-enable=[CLAUDE] Adds sulfur ore as a minable resource requiring steam. Spawns in starting area if early game changes are enabled.
feeds-n-speeds-extras-electroboiler-enable=[CLAUDE] Adds an electric-powered boiler for generating steam without fuel. Useful for solar-based steam power or fluid mining setups.
feeds-n-speeds-tweaks-timewaster-enable=[CLAUDE] Increases crafting and mining times for larger structures. A rocket silo shouldn't craft in 3 seconds.
feeds-n-speeds-tweaks-sulfur-processing-enable=[CLAUDE] Adds alternative oil processing recipes that extract sulfur as a byproduct.
feeds-n-speeds-tweaks-technologies-enable=[CLAUDE] Adjusts technology prerequisites. Turrets require gun turret tech, which requires military.

