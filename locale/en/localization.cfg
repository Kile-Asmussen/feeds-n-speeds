feeds-n-speeds-basic-materials-processing=<CLAUDE> Unlocks an improved stone furnace recipe using stone bricks instead of raw stone.
feeds-n-speeds-concrete-rail=<CLAUDE> Unlocks improved rail recipes using concrete and refined concrete for more efficient rail production.
feeds-n-speeds-concrete-wall=<CLAUDE> Unlocks a wall recipe using concrete instead of stone bricks.
feeds-n-speeds-sulfur-drilling=<CLAUDE> Supplementary to petroleum-derived sulfur, native sulfur deposits can be mined using steam injection. The techniques may be applicable to other, more exotic ores.
feeds-n-speeds-tweaked-steel-processing=Steel and iron products for basic manufacture and construction.
feeds-n-speeds-wet-drilling=<CLAUDE> Unlocks mining drills capable of using fluid, required for mining certain ores.

