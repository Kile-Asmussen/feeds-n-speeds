feeds-n-speeds-simple-concrete=[CLAUDE] A less efficient concrete recipe craftable in assembling machines.
feeds-n-speeds-purifying-oil-processing=[CLAUDE] A slower variant of basic oil processing that extracts sulfur as a byproduct.
feeds-n-speeds-purifying-advanced-oil-processing=[CLAUDE] A slower variant of advanced oil processing that extracts sulfur as a byproduct.
feeds-n-speeds-purifying-heavy-oil-cracking=[CLAUDE] A slower variant of heavy oil cracking that extracts sulfur as a byproduct.

