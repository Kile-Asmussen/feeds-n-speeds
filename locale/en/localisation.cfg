[entity-description]
feeds-n-speeds-shotgun-turret=A short-range turret that fires shotgun shells. Effective against clustered enemies.
feeds-n-speeds-sleeper-roboport=A roboport with extra storage capacity,
feeds-n-speeds-logistics-roboport=A roboport focused on logistics usage.
feeds-n-speeds-construction-roboport=A roboport with extra large construction range.
feeds-n-speeds-big-steel-chest=A bigger steel chest with more capacity
feeds-n-speeds-big-steel-hopper=A hopper for extending access to a big steel chest.
feeds-n-speeds-burner-mining-drill-fluid=<CLAUDE> A burner mining drill with fluid input for mining ores that require fluid.
feeds-n-speeds-electric-mining-drill-fluid=<CLAUDE> An electric mining drill with fluid input for mining ores that require fluid.
feeds-n-speeds-electroboiler=<CLAUDE> An electrically heated boiler for producing steam without fuel. Consumes 1.8MW.
feeds-n-speeds-small-radar=A smaller radar with lower power usage
feeds-n-speeds-sulfur-ore=<CLAUDE> A deposit of native sulfur that can be mined using steam (Frasch process).
feeds-n-speeds-sulfur-ore-patches=Internal noise expression for sulfur ore patch placement.
feeds-n-speeds-sulfur-ore-regular-index=Internal index for sulfur ore regular patch set.
feeds-n-speeds-sulfur-ore-starting-index=Internal index for sulfur ore starting patch set.
feeds-n-speeds-tweaked-heating-tower=<CLAUDE> Generates heat from chemical fuels with very high efficiency. Scales output based on demand. Passes heat to connected heat pipes which can be used for steam power, or to prevent freezing.
feeds-n-speeds-tweaked-nuclear-reactor=<CLAUDE> Uses uranium fuel cells to generate heat. Scales output based on demand. The heat output increases when built next to other reactors.

