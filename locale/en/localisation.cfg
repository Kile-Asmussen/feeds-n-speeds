[technology-description]
feeds-n-speeds-tweaked-heating-tower=Generates heat from chemical fuels with very high efficiency. Passes heat to connected heat pipes which can be used for steam power, or to prevent freezing.
feeds-n-speeds-shotgun-turret-tech=For mowing down hordes on your doorstep.
feeds-n-speeds-tweaked-electronics=Call on electricity for power and control, the nerves and brain of industry.
feeds-n-speeds-tweaked-steam-power=Build powerful engines, the beating heart of industry.
feeds-n-speeds-basic-materials-processing=Harness high temperatures with ceramics, the teeth and stomach of industry.
feeds-n-speeds-tweaked-steel-processing=Forge steel and iron, the bones of industry.
feeds-n-speeds-military-4-mass-production=Mass produce munitions with chemical products.
feeds-n-speeds-concrete-rail=Lay rail on concrete to cover more distance for the same steel.
feeds-n-speeds-concrete-wall=Build walls from concrete to get more wall per brick.
feeds-n-speeds-lab-tech=The backbone of the factory: research. And inserters and belts.
feeds-n-speeds-sulfur-drilling=Drill sulfur with steam as a drilling medium. May be applicable to other, more exotic ores.
feeds-n-speeds-wet-drilling=Unlocks drilling with fluid medium, necessary for certain ores.
feeds-n-speeds-worker-robots-battery=Increases the battery capacity of worker robots.

