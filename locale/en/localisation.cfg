[technology-description]
feeds-n-speeds-basic-materials-processing=Harness the power of ceramics and high temperatures, the heart of industry.
feeds-n-speeds-concrete-rail=Lay rail on concrete to cover more distance for the same steel.
feeds-n-speeds-concrete-wall=Build walls from concrete to get more wall per brick.
feeds-n-speeds-lab-tech=The backbone of the factory: research. And inserters and belts.
feeds-n-speeds-sulfur-drilling=Drill sulfur with steam as a drilling medium. May be applicable to other, more exotic ores.
feeds-n-speeds-tweaked-steel-processing=Forge steel and iron, the bones of industry.
feeds-n-speeds-wet-drilling=<CLAUDE> Unlocks mining drills capable of using fluid, required for mining certain ores.
feeds-n-speeds-worker-robots-battery=Increases the battery capacity of worker robots.

