[mod-setting-description]
feeds-n-speeds-extras-altrecipes-enable=Unlockable alternative recipes for a few things.
feeds-n-speeds-extras-chests-enable=Big steel chests and hoppers that extend it, for a seamless warehouse-like experience.
feeds-n-speeds-extras-drills-enable=Drills now need to be modified to drill fluids.
feeds-n-speeds-extras-electroboiler-enable=This one is self-explanatory.
feeds-n-speeds-extras-ores-enable=Sulfur ore as a minable resource, to supplement chemical production.
feeds-n-speeds-extras-radars-enable=A smaller radar to keep your factory under surveillance without overruning your electrical bill.
feeds-n-speeds-extras-roboports-enable=Roboport variants optimized for building construction or logistics networks.
feeds-n-speeds-restart-toggle=Do-nothing toggle, for restarting the game without menuing.
feeds-n-speeds-tweaks-chests-enable=Makes the chests smaller, to make the game just a little harder.
feeds-n-speeds-tweaks-concrete-enable="Concrete should be a much more important industrial product, don't you think?"
feeds-n-speeds-tweaks-earlygame-enable=Restructure early-game tech progression.
feeds-n-speeds-tweaks-electric-enable=Now you can have 100x100 city grids with ease.
feeds-n-speeds-tweaks-machines-enable=Adjustments to a few machines and buildings.
feeds-n-speeds-tweaks-malltech-enable=Adjust machine recipes to be more difficult, not to be more expensive, but to be more complicated.
feeds-n-speeds-tweaks-nuclear-enable=You know it, you love it. 1:5:10 ratio of reactors to HXs, to turbines.
feeds-n-speeds-tweaks-ores-enable=Regular ores are infinite, fluids no longer deplete.
feeds-n-speeds-tweaks-robotics-enable=Make it easier to keep your robots charged.
feeds-n-speeds-tweaks-sulfur-processing-enable=Clean the air by cleaning your oil of sulfur.
feeds-n-speeds-tweaks-technologies-enable=Adjust the tech tree in small ways, and the science packs in big ways.
feeds-n-speeds-tweaks-textplates-enable="Hide away all that textplate research. Don't worry about it."
feeds-n-speeds-tweaks-timewaster-enable="A rocket silo shouldn't craft in 3 seconds."
feeds-n-speeds-extras-heavy-enable="Everyone's favorite heavy weapon: shotguns. Now on a turret."
feeds-n-speeds-tweaks-military-enable=Pushes a lot of otherwise irrelevant weapons tech earlier in the game. Perfect for deathworld.
feeds-n-speeds-tweaks-start-enable=Start out with armor, a proper survival gun, and a bunch of salvage.

