[package]
name = "rawdata"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149" }
mlua = { version = "0.12.0-rc.1", features = ["lua52", "module", "serde"] }
mlua_derive = "0.11.0-beta.2"
assert-impl = "0.1.3"
rootcause = "0.12.1"